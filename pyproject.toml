[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "enthusiast-lens"
version = "0.1.0"
description = "Objective, provenance-preserving vehicle intelligence contracts."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.128,<1",
  "google-genai>=2.20,<3",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.25,<5",
  "pytest>=8.4,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers"]
pythonpath = ["src"]
testpaths = ["tests"]
